[project]
name = "floorplan"
version = "0.1.0"
description = "iPhone capture (photo, video or LiDAR) to a dimensioned, stitched floor plan with calibrated intervals"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "open3d>=0.19",
    "shapely>=2.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.scripts]
floorplan = "floorplan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
