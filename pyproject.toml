[project]
name = "floorplan"
version = "0.1.0"
description = "iPhone capture (photo, video or LiDAR) to a dimensioned, stitched floor plan with calibrated intervals"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "open3d>=0.19",
    "shapely>=2.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Needed only by the photo and video tiers, which estimate depth with a learned model.
# The LiDAR tier runs without any of this: `uv sync` alone is enough for it.
learned = [
    "torch>=2.4",
    "torchvision>=0.19",
    "huggingface-hub>=0.24",
    "pillow-heif>=0.18",
    "moge @ git+https://github.com/microsoft/MoGe.git@74fbce054ebed49800de42d0ad0e83495065719a",
    "transformers>=4.45",
    "mapanything @ git+https://github.com/facebookresearch/map-anything.git@3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9",
]

[project.scripts]
floorplan = "floorplan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/floorplan"]

[tool.uv]
# MoGe's package also declares its demo UI and the sparse-convolution library used only by
# its newest model. We run its MoGe-2 model, which needs none of them, so they are left
# out: the install stays small and works on macOS, where that library has no build.
exclude-dependencies = [
    "gradio", "starlette", "flex-gemm", "pipeline",
    # MapAnything and its encoder library also declare a 3D viewer, a training logger and an
    # object-store client, and an audio library. None is used for inference.
    "rerun-sdk", "tensorboard", "minio", "torchaudio",
]
# MapAnything pins one exact OpenCV build; any recent one works for what we call.
override-dependencies = ["opencv-python-headless>=4.9"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# GPU builds of PyTorch on Windows and Linux; the default CPU/MPS build elsewhere.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/floorplan/cli.py" = ["B008"]  # typer declares options as argument defaults
