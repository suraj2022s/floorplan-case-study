name: arkitscenes
description: >
  Public data, used while no iPhone is available: rooms from Apple's ARKitScenes dataset,
  each captured three times with the LiDAR of an iPad Pro (ARKit poses and depth) and scanned
  with a Faro laser. Ground truth is read off the laser scans by bench/public/laser_truth.py.
  The bedroom 467138 has walls, ceiling, area and openings; the bedroom 423441, the bathroom
  438802 and the kitchen 482863 have their ceiling height only (their walls do not fit the
  four-wall read-off). Rooms were chosen from Apple's metadata as visits with one laser scan
  and several videos, then kept only if the scanner stands inside the room under one ceiling
  level; 422009 (scanner in a doorway) and 483605 (two ceiling levels) were left out. This is
  real sensor data with laser ground truth, but not the benchmark set the brief specifies:
  no multi-room capture, no staged damage, an iPad rather than an iPhone, and captures made
  by Apple's operators rather than by our protocol. Fetch with
  python scripts/fetch_arkitscenes.py.

